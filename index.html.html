/* ---------------------------------------------------------------
   Local save support. The app was written for Claude's artifact
   storage; here it reads and writes your own browser's localStorage.
   Nothing is uploaded — the data never leaves this device.
   --------------------------------------------------------------- */
(function () {
  var PREFIX = "uds-";
  function key(k) { return PREFIX + String(k); }
  window.storage = {
    get: function (k) {
      return new Promise(function (res, rej) {
        try {
          var v = window.localStorage.getItem(key(k));
          if (v === null) rej(new Error("not found")); else res({ key: k, value: v });
        } catch (e) { rej(e); }
      });
    },
    set: function (k, v) {
      return new Promise(function (res, rej) {
        try { window.localStorage.setItem(key(k), String(v)); res({ key: k, value: v }); }
        catch (e) { rej(e); }
      });
    },
    delete: function (k) {
      return new Promise(function (res, rej) {
        try { window.localStorage.removeItem(key(k)); res({ key: k, deleted: true }); }
        catch (e) { rej(e); }
      });
    },
    list: function (prefix) {
      return new Promise(function (res) {
        var keys = [];
        for (var i = 0; i < window.localStorage.length; i++) {
          var k = window.localStorage.key(i);
          if (k.indexOf(PREFIX) === 0) keys.push(k.slice(PREFIX.length));
        }
        res({ keys: keys });
      });
    }
  };
})();
</script>

        .forEach((p, i) => { POS_RANK[p.name] = i + 1; });
});
// A player's tier has to be judged against HIS OWN position, not the overall board.
// The TE4 is a weekly starter even though his overall rank sits near WR40 — because a
// league starts ~12 tight ends and ~40 receivers. Thresholds below are roughly
// "how many of this position does a 12-team league actually start each week".
// Tiers are judged against a player's OWN position and use the language fantasy players
// already speak: "he's a high-end RB2" says far more than "good". Bands are sized to how
// many of each position a 12-team league actually starts, so the same overall rank means
// different things at RB and TE — which is the whole point.
const TIER_BANDS = {
    RB: [5, 12, 20, 30, 42, 58],
    WR: [6, 15, 24, 36, 50, 70],
    TE: [2, 6, 12, 18, 24, 32],
    QB: [3, 8, 14, 20, 26, 32],
};
const TIER_COLORS = ["#c084fc", "#34d399", "#38bdf8", "#fbbf24", "#fb923c", "#9ca3af", "#6b7280"];
function tierLabelFor(pos, idx) {
    // 0 elite · 1 the position's #1 · 2 his #2 · 3 his #3 · 4 flex-worthy · 5 bench · 6 dart
    if (idx === 0)
        return "ELITE";
    if (idx <= 3)
        return pos + idx; // RB1 / WR2 / TE3 ...
    if (idx === 4)
        return pos === "QB" ? "STREAM" : "FLEX";
    if (idx === 5)
        return "DEPTH";
    return "FLIER";
}
function valueTier(rank, pos, name) {
    const bands = TIER_BANDS[pos];
    if (!bands) {
        const i = rank <= 24 ? 1 : rank <= 90 ? 3 : 5;
        return { label: tierLabelFor(pos || "", i), color: TIER_COLORS[i] };
    }
    const pr = POS_RANK[name] != null ? POS_RANK[name] : 999;
    let idx = bands.length;
    for (let i = 0; i < bands.length; i++) {
        if (pr <= bands[i]) {
            idx = i;
            break;
        }
    }
    return { label: tierLabelFor(pos, idx), color: TIER_COLORS[idx] };
}
